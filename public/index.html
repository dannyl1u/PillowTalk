<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/98.css" />
    <title>Pillow Talk ☁️</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: url('/bliss.jpg') center/cover;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .window {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .container {
            padding: 25px;
            width: 100%;
            text-align: center;
        }

        .title-bar {
            cursor: move;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            color: #666;
            margin-bottom: 40px;
            font-size: 1.1em;
        }

        .create-btn {
            background: linear-gradient(180deg, #ece9d8 0%, #d4d0c8 50%, #bfbab0 100%);
            color: #000;
            border: 2px outset #dfdfdf;
            padding: 18px 40px;
            font-size: 1.2em;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-weight: 600;
            box-shadow: inset 1px 1px 0 rgba(255,255,255,0.8), inset -1px -1px 0 rgba(0,0,0,0.2);
        }

        .create-btn:hover {
            background: linear-gradient(180deg, #f0ede6 0%, #d8d4cc 50%, #c3beb4 100%);
        }

        .create-btn:active {
            border-style: inset;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #ece9d8;
            padding: 40px;
            max-width: 450px;
            width: 90%;
            position: relative;
            border: 3px ridge #dfdfdf;
            box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.5);
        }

        .modal h2 {
            margin-bottom: 25px;
            color: #000080;
            font-family: 'Trebuchet MS', Arial, sans-serif;
        }

        .input-group {
            margin-bottom: 25px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #000;
            font-weight: 500;
            font-family: 'Tahoma', Arial, sans-serif;
        }

        .input-group input {
            width: 100%;
            padding: 8px;
            border: 2px inset #dfdfdf;
            background: white;
            font-size: 1em;
            font-family: 'Tahoma', Arial, sans-serif;
        }

        .input-group input:focus {
            outline: 1px dotted black;
            outline-offset: -3px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        .btn {
            flex: 1;
            padding: 10px;
            border: 2px outset #dfdfdf;
            font-size: 1em;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            font-family: 'Tahoma', Arial, sans-serif;
            box-shadow: inset 1px 1px 0 rgba(255,255,255,0.8), inset -1px -1px 0 rgba(0,0,0,0.2);
        }

        .btn:active {
            border-style: inset;
        }

        .btn-primary {
            background: linear-gradient(180deg, #5a9fd4 0%, #306fc5 100%);
            color: white;
        }

        .btn-primary:hover {
            background: linear-gradient(180deg, #6aafef 0%, #407fd5 100%);
        }

        .btn-secondary {
            background: linear-gradient(180deg, #ece9d8 0%, #d4d0c8 50%, #bfbab0 100%);
            color: #000;
        }

        .btn-secondary:hover {
            background: linear-gradient(180deg, #f0ede6 0%, #d8d4cc 50%, #c3beb4 100%);
        }

        .link-display {
            display: none;
            margin-top: 20px;
            padding: 15px;
            background: white;
            border: 2px inset #dfdfdf;
            word-break: break-all;
        }

        .link-display.active {
            display: block;
        }

        .link-text {
            color: #0000ee;
            margin-bottom: 10px;
            font-size: 0.95em;
            text-decoration: underline;
        }

        .copy-btn {
            margin-top: 10px;
            padding: 8px 20px;
            background: linear-gradient(180deg, #5a9fd4 0%, #306fc5 100%);
            color: white;
            border: 2px outset #dfdfdf;
            cursor: pointer;
            font-size: 0.9em;
            font-family: 'Tahoma', Arial, sans-serif;
            font-weight: 600;
            box-shadow: inset 1px 1px 0 rgba(255,255,255,0.8), inset -1px -1px 0 rgba(0,0,0,0.2);
        }

        .copy-btn:hover {
            background: linear-gradient(180deg, #6aafef 0%, #407fd5 100%);
        }

        .copy-btn:active {
            border-style: inset;
        }

        .success-message {
            color: #008000;
            margin-top: 10px;
            font-size: 0.9em;
            font-family: 'Tahoma', Arial, sans-serif;
        }

        .error-message {
            color: #cc0000;
            margin-top: 10px;
            font-size: 0.9em;
            font-family: 'Tahoma', Arial, sans-serif;
        }
    </style>
</head>
<body>
    <div class="window">
        <div class="title-bar">
        <div class="title-bar-text">pillowtalk.exe</div>
        <div class="title-bar-controls">
            <button aria-label="Minimize"></button>
            <button aria-label="Maximize"></button>
            <button aria-label="Close"></button>
        </div>
        </div>
        <div class="container">
            <h1>☁️ Pillow Talk</h1>
            <p class="subtitle">safe and cozy</p>
            <button class="create-btn" onclick="openModal()">Create New Room</button>
        </div>
    </div>

    <div class="modal" id="createModal">
        <div class="modal-content">
            <h2>Create a New Room</h2>
            <div class="input-group">
                <label for="password">Set Room Password</label>
                <input type="password" id="password" placeholder="Enter a secure password (min 6 characters)" />
            </div>
            <div class="btn-group">
                <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                <button class="btn btn-primary" onclick="createRoom()">Create Room</button>
            </div>
            <div class="link-display" id="linkDisplay">
                <p><strong>Room Created!</strong></p>
                <p>
                    <a class="link-text" id="roomLink" href="#" target="_blank"></a>
                </p>
                <button class="copy-btn" onclick="copyLink()">Copy Link</button>
                <p class="success-message" id="copySuccess" style="display: none;">Link copied!</p>
            </div>
            <p class="error-message" id="errorMessage" style="display: none;"></p>
        </div>
    </div>

    <script>
        // Make window draggable
        const windowElement = document.querySelector('.window');
        const titleBar = document.querySelector('.title-bar');
        
        let isDragging = false;
        let currentX;
        let currentY;
        let initialX;
        let initialY;
        let xOffset = 0;
        let yOffset = 0;

        titleBar.addEventListener('mousedown', dragStart);
        document.addEventListener('mousemove', drag);
        document.addEventListener('mouseup', dragEnd);

        function dragStart(e) {
            initialX = e.clientX - xOffset;
            initialY = e.clientY - yOffset;
            isDragging = true;
        }

        function drag(e) {
            if (isDragging) {
                e.preventDefault();
                currentX = e.clientX - initialX;
                currentY = e.clientY - initialY;
                xOffset = currentX;
                yOffset = currentY;
                
                windowElement.style.transform = `translate(calc(-50% + ${currentX}px), calc(-50% + ${currentY}px))`;
            }
        }

        function dragEnd() {
            isDragging = false;
        }

        function openModal() {
            document.getElementById('createModal').classList.add('active');
            document.getElementById('password').value = '';
            document.getElementById('linkDisplay').classList.remove('active');
            document.getElementById('errorMessage').style.display = 'none';
            document.getElementById('copySuccess').style.display = 'none';
        }

        function closeModal() {
            document.getElementById('createModal').classList.remove('active');
        }

        async function createRoom() {
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMessage');
            
            if (password.length < 4) {
                errorMsg.textContent = 'Password must be at least 6 characters';
                errorMsg.style.display = 'block';
                return;
            }

            errorMsg.style.display = 'none';

            try {
                const response = await fetch('/api/create-room', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ password })
                });

                const data = await response.json();

                if (response.ok) {
                    const linkElem = document.getElementById('roomLink');
                    linkElem.textContent = data.link;
                    linkElem.href = data.link;
                    document.getElementById('linkDisplay').classList.add('active');
                    window.generatedLink = data.link;
                } else {
                    errorMsg.textContent = data.error || 'Failed to create room';
                    errorMsg.style.display = 'block';
                }
            } catch (error) {
                errorMsg.textContent = 'Network error. Please try again.';
                errorMsg.style.display = 'block';
            }
        }

        function copyLink() {
            const link = window.generatedLink;
            navigator.clipboard.writeText(link).then(() => {
                document.getElementById('copySuccess').style.display = 'block';
                setTimeout(() => {
                    document.getElementById('copySuccess').style.display = 'none';
                }, 2000);
            });
        }

        // Close modal when clicking outside
        document.getElementById('createModal').addEventListener('click', (e) => {
            if (e.target.id === 'createModal') {
                closeModal();
            }
        });

        // Allow Enter key to create room
        document.getElementById('password').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                createRoom();
            }
        });
    </script>
</body>
</html>
